name: Test

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      X_API_KEY: dummy_api_key
      X_API_KEY_SECRET: dummy_api_key_secret
      X_ACCESS_TOKEN: dummy_access_token
      X_ACCESS_TOKEN_SECRET: dummy_access_token_secret
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Install dependencies
        run: uv pip install --system -e ".[dev]"

      - name: Run tests with coverage
        run: |
          export X_API_KEY=dummy_api_key
          export X_API_KEY_SECRET=dummy_api_key_secret
          export X_ACCESS_TOKEN=dummy_access_token
          export X_ACCESS_TOKEN_SECRET=dummy_access_token_secret
          uv run pytest tests/ -v --cov=src --cov-report=xml --cov-report=html --cov-fail-under=80

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
