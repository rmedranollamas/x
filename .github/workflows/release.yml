name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag name for release (optional, e.g. v1.0.0)'
        required: false
        type: string

jobs:
  build:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            output_name: x-agent-linux-amd64
          - goos: linux
            goarch: arm64
            output_name: x-agent-linux-arm64
          - goos: darwin
            goarch: amd64
            output_name: x-agent-darwin-amd64
          - goos: darwin
            goarch: arm64
            output_name: x-agent-darwin-arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build binary
        shell: bash
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
            go build -trimpath -ldflags "-s -w" \
            -o "dist/${{ matrix.output_name }}" ./cmd/x-agent

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.output_name }}
          path: dist/${{ matrix.output_name }}
          if-no-files-found: error

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate Checksums
        shell: bash
        run: |
          cd dist
          chmod +x x-agent-*
          sha256sum x-agent-* > checksums.txt
          cat checksums.txt

      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          TAG="${{ inputs.tag }}"
          if [ -z "$TAG" ]; then
            TAG="${{ github.ref_name }}"
          fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [[ ! "$TAG" =~ ^v[0-9] ]]; then
            TAG="v$(date +'%Y.%m.%d-%H%M%S')"
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists. Uploading assets..."
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" \
              --title "Release $TAG" \
              --generate-notes \
              dist/*
          fi
